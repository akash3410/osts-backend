<div class="container-xxl py-5 section-tint float-panel">
    <div class="container py-5">
        <div class="text-center mx-auto wow fadeInUp" data-wow-delay="0.1s" style="max-width: 640px;">
            <span class="eyebrow"><i class="bi bi-grid-fill"></i> Our Services</span>
            <h2 class="section-title">Explore Our Services</h2>
            <p class="section-sub">Full-cycle software engineering — designed, built and scaled by one dedicated team.</p>
        </div>
        <div class="row g-4 mt-2">
            {% for service in services %}
                <div class="col-md-6 col-lg-4 wow fadeInUp" data-wow-delay="0.2s">
                    <div class="service-item h-100 d-flex flex-column">
                        <div class="overflow-hidden" style="border-radius: 20px 20px 0 0;">
                            <img class="img-fluid w-100" style="height: 230px; object-fit: cover;" src="{{ service.image.url }}" alt="{{ service.title }}">
                        </div>
                        <div class="p-4 d-flex flex-column flex-grow-1">
                            <h5 class="mb-2">{{ service.title }}</h5>
                            <p class="text-secondary mb-3" style="font-size: .95rem;">{{ service.description }}</p>
                            <a class="text-link mt-auto align-self-start" href="">Learn more <i class="bi bi-arrow-right"></i></a>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</div>
