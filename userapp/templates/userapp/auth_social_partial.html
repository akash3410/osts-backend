{% load socialaccount %}

<div class="auth-divider"><span>Or</span></div>

<div class="auth-social">
    <form method="post" action="{% provider_login_url 'google' %}">
        {% csrf_token %}
        <button type="submit" class="auth-social-btn" aria-label="Continue with Google" title="Continue with Google">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.4-1.7 4.1-5.5 4.1-3.3 0-6-2.7-6-6s2.7-6 6-6c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.7 3.5 14.6 2.6 12 2.6 6.8 2.6 2.6 6.8 2.6 12S6.8 21.4 12 21.4c5.4 0 9-3.8 9-9.1 0-.6-.07-1.1-.16-1.6H12z"/>
            </svg>
        </button>
    </form>

    <form method="post" action="{% provider_login_url 'facebook' %}">
        {% csrf_token %}
        <button type="submit" class="auth-social-btn" aria-label="Continue with Facebook" title="Continue with Facebook">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path fill="#1877F2" d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5.02 3.66 9.18 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.52 1.5-3.91 3.77-3.91 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.78-1.63 1.57v1.89h2.78l-.45 2.91h-2.33V22c4.78-.76 8.44-4.92 8.44-9.94z"/>
            </svg>
        </button>
    </form>

    <form method="post" action="{% provider_login_url 'apple' %}">
        {% csrf_token %}
        <button type="submit" class="auth-social-btn" aria-label="Continue with Apple" title="Continue with Apple">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path fill="#000000" d="M16.37 12.68c.02-2.3 1.88-3.4 1.96-3.46-1.07-1.56-2.73-1.78-3.32-1.8-1.42-.15-2.77.83-3.49.83-.72 0-1.83-.81-3-.79-1.55.02-2.98.9-3.77 2.28-1.6 2.78-.41 6.9 1.15 9.15.76 1.1 1.67 2.34 2.86 2.3 1.15-.05 1.58-.74 2.97-.74 1.38 0 1.77.74 2.98.72 1.23-.02 2.01-1.12 2.76-2.23.87-1.28 1.23-2.52 1.25-2.58-.03-.01-2.4-.92-2.42-3.66zM14.1 5.4c.63-.77 1.06-1.83.94-2.9-.91.04-2.02.61-2.67 1.37-.58.68-1.09 1.77-.96 2.81 1.02.08 2.06-.52 2.69-1.28z"/>
            </svg>
        </button>
    </form>
</div>
