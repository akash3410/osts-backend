{# Standalone transactional email — do NOT extend a site-wide base template. #}
{# Inlining every CSS property is deliberate: Gmail, Outlook and Apple Mail #}
{# strip <style> blocks inconsistently, so the code box must survive that. #}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background-color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1e293b;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f1f5f9;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:500px;background-color:#ffffff;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="padding:28px 32px 8px 32px;text-align:center;">
              <div style="width:64px;height:64px;border-radius:50%;background-color:#fef2f2;border:1px solid #fca5a5;margin:0 auto 14px auto;line-height:64px;font-size:28px;color:#dc2626;">&#128274;</div>
              <h1 style="margin:0;font-size:22px;color:#0f172a;">Reset Your Password</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px;">
              <p style="margin:0 0 14px 0;font-size:15px;line-height:1.6;">Hello <strong>{{ recipient_name }}</strong>,</p>
              <p style="margin:0 0 4px 0;font-size:15px;line-height:1.6;">We received a request to reset your password. Use the code below to choose a new password:</p>
            </td>
          </tr>
          <tr>
            <td style="padding:22px 32px;text-align:center;">
              <div style="display:inline-block;font-size:36px;font-weight:700;letter-spacing:8px;color:#dc2626;background-color:#fef2f2;padding:14px 20px;border-radius:8px;border:1px dashed #fca5a5;">{{ code }}</div>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px;">
              <p style="margin:0;font-size:14px;color:#64748b;line-height:1.6;">
                This code expires in <strong>{{ ttl_minutes }} minutes</strong>.
                If you didn't request a password reset, you can safely ignore
                this email &mdash; your password won't change.
              </p>
              <p style="margin:14px 0 0 0;font-size:14px;color:#64748b;line-height:1.6;">
                For your security, never share this code with anyone.
                {{ site_name }} will never ask for it.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px 28px 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-top:1px solid #e2e8f0;">
                <tr>
                  <td style="padding-top:16px;text-align:center;">
                    <p style="margin:0;font-size:13px;color:#94a3b8;line-height:1.6;">
                      Best regards,<br>
                      The {{ site_name }} Team
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
